name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DATABASE_URL: ':memory:'
  ALLOW_IN_MEMORY_SQLITE_FOR_TESTS: '1'

jobs:
  # ─── 1. Unit & Integration Tests (Vitest) ───────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Seed test database
        run: |
          npm run db:push:force
          npm run db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Vitest (unit + data integrity + security)
        run: npm run test:coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Check coverage thresholds
        run: |
          echo "Coverage report generated. Check for minimum thresholds:"
          echo "  - Lines: 60%"
          echo "  - Functions: 60%"
          echo "  - Branches: 50%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─── 2. End-to-End Tests (Playwright) ───────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Seed test database
        run: |
          npm run db:push:force
          npm run db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PATIENT_EMAIL: patient@test.local
          PATIENT_PASSWORD: password123
          DIETITIAN_EMAIL: dev@example.com
          DIETITIAN_PASSWORD: password
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── 3. Type Check ───────────────────────────────────────────────────────────
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  # ─── 4. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # ─── 5. Security Tests ──────────────────────────────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Run security tests
        run: npx vitest run tests/security/ --reporter=verbose

  # ─── 6. Data Integrity Tests ────────────────────────────────────────────────
  data-integrity-tests:
    name: Data Integrity Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Run data integrity tests
        run: npx vitest run tests/data-integrity/ --reporter=verbose

  # ─── 7. Load Tests (k6) — Manual/Scheduled only ─────────────────────────────
  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run baseline load test
        run: |
          k6 run tests/load/baseline-load.js \
            -e BASE_URL=${{ vars.LOAD_TEST_URL || 'http://localhost:5173' }} \
            -e SESSION_COOKIE=${{ secrets.LOAD_TEST_SESSION || '' }}
        continue-on-error: true

      - name: Run API endpoints load test
        run: |
          k6 run tests/load/api-endpoints-load.js \
            -e BASE_URL=${{ vars.LOAD_TEST_URL || 'http://localhost:5173' }} \
            -e SESSION_COOKIE=${{ secrets.LOAD_TEST_SESSION || '' }}
        continue-on-error: true
