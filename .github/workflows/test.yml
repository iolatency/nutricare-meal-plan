name: NutriCare Meal Plan — Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Unit Tests (Vitest) ─────────────────────────────────────────────────────
  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage/

  # ─── E2E Tests (Playwright) ───────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed dev database
        run: |
          npm run db:push:force
          npm run db:seed-dev-user
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  # ─── Security header check (lightweight, no k6) ──────────────────────────────
  security-tests:
    name: Security header tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed dev database
        run: |
          npm run db:push:force
          npm run db:seed-dev-user

      - name: Run security tests
        run: npx playwright test tests/security/security-headers.spec.ts
        env:
          CI: true

  # ─── Data Integrity check ─────────────────────────────────────────────────────
  data-integrity:
    name: SQLite data integrity
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap & seed database
        run: |
          npm run db:push:force
          npm run db:seed-dev-user

      - name: Run data integrity checks
        run: npx tsx tests/data-integrity/validate-db.ts

  # ─── Type Check ──────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
